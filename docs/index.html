<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SLOT DATA PORTAL</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="top_style.css">
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.16/dist/framer-motion.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence, useScroll, useTransform } = window.Motion;

        // Custom Hook for Window Size
        function useWindowSize() {
            const [size, setSize] = useState([window.innerWidth, window.innerHeight]);
            useEffect(() => {
                const handleResize = () => setSize([window.innerWidth, window.innerHeight]);
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);
            return size;
        }

        const App = () => {
            const [width] = useWindowSize();
            const isMobile = width <= 768;

            // Framer motion variants
            const containerVariants = {
                hidden: { opacity: 0 },
                visible: {
                    opacity: 1,
                    transition: { staggerChildren: 0.2, delayChildren: 0.1 }
                }
            };

            const itemVariants = {
                hidden: { y: 50, opacity: 0 },
                visible: { y: 0, opacity: 1, transition: { type: "spring", stiffness: 100, damping: 12 } }
            };

            const titleVariants = {
                hidden: { x: -100, opacity: 0 },
                visible: { x: 0, opacity: 1, transition: { type: "spring", stiffness: 80, damping: 20 } }
            };

            // Layout Styles (Solid colors, no gradients/glass/shadows)
            const styles = {
                container: {
                    display: 'flex',
                    flexDirection: isMobile ? 'column' : 'row',
                    minHeight: '100vh',
                    width: '100%',
                    backgroundColor: 'var(--color-bg)',
                    overflow: 'hidden'
                },
                leftPanel: {
                    flex: 1,
                    backgroundColor: 'var(--color-primary)',
                    display: 'flex',
                    flexDirection: 'column',
                    justifyContent: 'center',
                    padding: isMobile ? '3rem 2rem' : '5rem',
                    position: 'relative',
                    zIndex: 2,
                    borderRight: isMobile ? 'none' : '10px solid var(--color-text)',
                    borderBottom: isMobile ? '10px solid var(--color-text)' : 'none',
                },
                rightPanel: {
                    flex: 1,
                    backgroundColor: 'var(--color-accent)',
                    display: 'flex',
                    flexDirection: 'column',
                    alignItems: 'center',
                    justifyContent: 'center',
                    padding: isMobile ? '3rem 2rem' : '5rem',
                    position: 'relative',
                    overflow: 'hidden'
                },
                title: {
                    fontSize: isMobile ? '3.5rem' : '6rem',
                    color: 'var(--color-white)',
                    marginBottom: '1rem',
                    letterSpacing: '-0.02em',
                    lineHeight: '1',
                },
                subtitle: {
                    fontSize: isMobile ? '1.2rem' : '1.5rem',
                    color: 'var(--color-text)',
                    backgroundColor: 'var(--color-white)',
                    padding: '0.5rem 1rem',
                    display: 'inline-block',
                    alignSelf: 'flex-start',
                    marginBottom: '3rem',
                    fontWeight: '700',
                    border: '4px solid var(--color-text)'
                },
                navGrid: {
                    display: 'grid',
                    gridTemplateColumns: isMobile ? '1fr' : '1fr 1fr',
                    gap: '1.5rem',
                    width: '100%',
                    maxWidth: '800px',
                    position: 'relative',
                    zIndex: 3
                },
                storeCard: {
                    backgroundColor: 'var(--color-white)',
                    border: '8px solid var(--color-text)',
                    padding: '2rem',
                    cursor: 'pointer',
                    textDecoration: 'none',
                    display: 'flex',
                    flexDirection: 'column',
                    justifyContent: 'space-between',
                    minHeight: '250px',
                    position: 'relative',
                    overflow: 'hidden'
                },
                storeName: {
                    fontSize: '2rem',
                    color: 'var(--color-text)',
                    marginBottom: '1rem',
                },
                storeLabel: {
                    fontSize: '1rem',
                    color: 'var(--color-white)',
                    backgroundColor: 'var(--color-secondary)',
                    padding: '0.5rem 1rem',
                    display: 'inline-block',
                    fontWeight: '700',
                    border: '3px solid var(--color-text)'
                },
                imageDecoration: {
                    position: 'absolute',
                    top: 0,
                    left: 0,
                    width: '100%',
                    height: '100%',
                    objectFit: 'cover',
                    opacity: 0.15,
                    pointerEvents: 'none'
                },
                dragBox: {
                    width: '150px',
                    height: '150px',
                    backgroundColor: 'var(--color-secondary)',
                    border: '6px solid var(--color-text)',
                    position: 'absolute',
                    top: isMobile ? '-75px' : '10%',
                    right: isMobile ? '10%' : '-75px',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    color: 'var(--color-white)',
                    fontWeight: '900',
                    fontSize: '1.5rem',
                    cursor: 'grab',
                    zIndex: 10
                },
                marqueeContainer: {
                    position: 'absolute',
                    bottom: 0,
                    left: 0,
                    width: '100%',
                    backgroundColor: 'var(--color-text)',
                    padding: '1rem 0',
                    display: 'flex',
                    whiteSpace: 'nowrap',
                    overflow: 'hidden',
                    borderTop: '6px solid var(--color-bg)',
                    zIndex: 5
                },
                marqueeText: {
                    color: 'var(--color-accent)',
                    fontSize: '2rem',
                    fontWeight: '900',
                    paddingRight: '2rem',
                    textTransform: 'uppercase'
                }
            };

            return (
                <motion.div 
                    style={styles.container}
                    variants={containerVariants}
                    initial="hidden"
                    animate="visible"
                >
                    {/* Left Panel */}
                    <div style={styles.leftPanel}>
                        <img src="assets/top_hero_bg.png" alt="Decorative" style={styles.imageDecoration} />
                        
                        <motion.h1 style={styles.title} variants={titleVariants}>
                            DATA<br/>DRIVEN<br/>SLOT
                        </motion.h1>
                        <motion.div style={styles.subtitle} variants={itemVariants}>
                            ANALYTICS PORTAL
                        </motion.div>

                        <motion.div 
                            style={styles.dragBox}
                            drag
                            dragConstraints={{ left: -100, right: 300, top: -100, bottom: 300 }}
                            whileDrag={{ scale: 1.1, rotate: 15 }}
                            whileHover={{ scale: 1.05 }}
                            className="no-select"
                        >
                            DRAG ME
                        </motion.div>
                    </div>

                    {/* Right Panel */}
                    <div style={styles.rightPanel}>
                        {/* Free stock image as background accent */}
                        <img src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&w=1000&q=80" alt="Abstract Data" style={styles.imageDecoration} />
                        
                        <div style={styles.navGrid}>
                            <motion.a 
                                href="./ogiya/index.html" 
                                style={{...styles.storeCard, backgroundColor: '#EFEFEF'}}
                                variants={itemVariants}
                                whileHover={{ scale: 1.03, y: -10, backgroundColor: 'var(--color-white)' }}
                                whileTap={{ scale: 0.97 }}
                            >
                                <div>
                                    <h2 style={styles.storeName}>オーギヤタウン<br/>半田店</h2>
                                </div>
                                <div>
                                    <span style={{...styles.storeLabel, backgroundColor: 'var(--color-primary)'}}>ENTER DASHBOARD &rarr;</span>
                                </div>
                                {/* Inner decoration shape */}
                                <motion.div 
                                    style={{ position: 'absolute', right: '-20px', bottom: '-20px', width: '100px', height: '100px', backgroundColor: 'var(--color-primary)', borderRadius: '50%', zIndex: 0, opacity: 0.2 }}
                                    animate={{ scale: [1, 1.2, 1] }}
                                    transition={{ duration: 3, repeat: Infinity }}
                                />
                            </motion.a>

                            <motion.a 
                                href="./cosmo_obu/index.html" 
                                style={{...styles.storeCard, backgroundColor: '#EFEFEF'}}
                                variants={itemVariants}
                                whileHover={{ scale: 1.03, y: -10, backgroundColor: 'var(--color-white)' }}
                                whileTap={{ scale: 0.97 }}
                            >
                                <div>
                                    <h2 style={styles.storeName}>コスモジャパン<br/>大府店</h2>
                                </div>
                                <div>
                                    <span style={styles.storeLabel}>ENTER DASHBOARD &rarr;</span>
                                </div>
                                {/* Inner decoration shape */}
                                <motion.div 
                                    style={{ position: 'absolute', right: '-20px', bottom: '-20px', width: '100px', height: '100px', backgroundColor: 'var(--color-secondary)', zIndex: 0, opacity: 0.2 }}
                                    animate={{ rotate: [0, 90, 180, 270, 360] }}
                                    transition={{ duration: 10, repeat: Infinity, ease: "linear" }}
                                />
                            </motion.a>

                            <motion.a 
                                href="./kyoraku_t/index.html" 
                                style={{...styles.storeCard, backgroundColor: '#EFEFEF'}}
                                variants={itemVariants}
                                whileHover={{ scale: 1.03, y: -10, backgroundColor: 'var(--color-white)' }}
                                whileTap={{ scale: 0.97 }}
                            >
                                <div>
                                    <h2 style={styles.storeName}>kyoraku<br/>東海店</h2>
                                </div>
                                <div>
                                    <span style={{...styles.storeLabel, backgroundColor: '#FF5722'}}>ENTER DASHBOARD &rarr;</span>
                                </div>
                                {/* Inner decoration shape */}
                                <motion.div 
                                    style={{ position: 'absolute', right: '-20px', bottom: '-20px', width: '100px', height: '100px', backgroundColor: '#FF5722', borderRadius: '10%', zIndex: 0, opacity: 0.2 }}
                                    animate={{ scale: [1, 1.1, 1], rotate: [0, -10, 0] }}
                                    transition={{ duration: 5, repeat: Infinity }}
                                />
                            </motion.a>

                            <motion.a 
                                href="./king666_t/index.html" 
                                style={{...styles.storeCard, backgroundColor: '#EFEFEF'}}
                                variants={itemVariants}
                                whileHover={{ scale: 1.03, y: -10, backgroundColor: 'var(--color-white)' }}
                                whileTap={{ scale: 0.97 }}
                            >
                                <div>
                                    <h2 style={styles.storeName}>KING666<br/>東海店</h2>
                                </div>
                                <div>
                                    <span style={{...styles.storeLabel, backgroundColor: '#673AB7'}}>ENTER DASHBOARD &rarr;</span>
                                </div>
                                {/* Inner decoration shape */}
                                <motion.div 
                                    style={{ position: 'absolute', right: '-20px', bottom: '-20px', width: '100px', height: '100px', backgroundColor: '#673AB7', clipPath: 'polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%)', zIndex: 0, opacity: 0.2 }}
                                    animate={{ rotate: [0, -360], scale: [1, 1.2, 1] }}
                                    transition={{ duration: 8, repeat: Infinity, ease: "linear" }}
                                />
                            </motion.a>

                            <motion.a 
                                href="./king666_h/index.html" 
                                style={{...styles.storeCard, backgroundColor: '#EFEFEF'}}
                                variants={itemVariants}
                                whileHover={{ scale: 1.03, y: -10, backgroundColor: 'var(--color-white)' }}
                                whileTap={{ scale: 0.97 }}
                            >
                                <div>
                                    <h2 style={styles.storeName}>KING666<br/>半田店</h2>
                                </div>
                                <div>
                                    <span style={{...styles.storeLabel, backgroundColor: '#00BCD4'}}>ENTER DASHBOARD &rarr;</span>
                                </div>
                                {/* Inner decoration shape */}
                                <motion.div 
                                    style={{ position: 'absolute', right: '-20px', bottom: '-20px', width: '100px', height: '100px', backgroundColor: '#00BCD4', clipPath: 'polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%)', zIndex: 0, opacity: 0.2 }}
                                    animate={{ rotate: [0, 360], scale: [1, 1.3, 1] }}
                                    transition={{ duration: 6, repeat: Infinity, ease: "linear" }}
                                />
                            </motion.a>
                        </div>

                        {/* Marquee Ticker */}
                        <div style={styles.marqueeContainer}>
                            <motion.div
                                animate={{ x: [0, -1000] }}
                                transition={{ repeat: Infinity, duration: 15, ease: "linear" }}
                                style={{ display: 'flex' }}
                            >
                                {[...Array(10)].map((_, i) => (
                                    <span key={i} style={styles.marqueeText}>
                                        CHOOSE YOUR STORE • VIEW ANALYTICS • 
                                    </span>
                                ))}
                            </motion.div>
                        </div>
                    </div>
                </motion.div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
